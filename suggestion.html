<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suggérer une œuvre - NovelNeko</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .suggestion-form {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 2rem;
      max-width: 500px;
      margin: 2rem auto;
      border: 1px solid var(--card-border);
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      color: var(--text-primary);
    }
    .suggestion-form label {
      display: block;
      margin-top: 1rem;
      margin-bottom: 0.3rem;
      font-weight: 500;
    }
    .suggestion-form input,
    .suggestion-form select,
    .suggestion-form textarea {
      width: 100%;
      padding: 0.7em 1em;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      background: rgba(15,23,42,0.5);
      color: var(--text-primary);
      margin-bottom: 1rem;
      font-size: 1rem;
      resize: vertical;
    }
    .suggestion-form button {
      background: linear-gradient(45deg, var(--primary), var(--secondary));
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.8em 2em;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 0.5rem;
    }
    .suggestion-form button:hover {
      background: linear-gradient(45deg, var(--secondary), var(--primary));
    }
    .success-message {
      color: var(--secondary);
      text-align: center;
      margin-top: 1rem;
      font-weight: bold;
    }
    .error-message {
      color: var(--accent);
      text-align: center;
      margin-top: 1rem;
      font-weight: bold;
    }
    .back-btn {
      display: inline-block;
      background: linear-gradient(45deg, var(--primary), var(--secondary));
      color: white;
      padding: 0.8rem 1.5rem;
      text-decoration: none;
      border-radius: 8px;
      transition: all 0.3s ease;
      font-weight: 500;
      box-shadow: 0 4px 15px rgba(74, 222, 255, 0.3);
      margin-top: 2rem;
    }

    .back-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(74, 222, 255, 0.5);
    }
  </style>
</head>
<body>
  <div id="particles"></div>
  <a href="index.html" class="back-btn" style="position:fixed;top:30px;left:30px;z-index:1002;">← Retour</a>
  <section class="header">
    <div class="header-container">
      <h1>💡 Suggérer une œuvre</h1>
      <p class="credits">Remplissez le formulaire ci-dessous pour proposer un light novel, un manga ou un animé à ajouter sur NovelNeko !</p>
    </div>
  </section>

  <form class="suggestion-form" id="suggestionForm">
    <label for="type">Type de contenu <span class="highlight">*</span></label>
    <select id="type" name="type" required>
      <option value="">Choisissez…</option>
      <option value="Light Novel">Light Novel</option>
      <option value="Manga">Manga</option>
      <option value="Animé">Animé</option>
    </select>

    <label for="titre">Titre du contenu <span class="highlight">*</span></label>
    <input type="text" id="titre" name="titre" placeholder="exemple : Arifureta, Your name" required>

    <label for="pseudo">Votre pseudo (optionnel)</label>
    <input type="text" id="pseudo" name="pseudo" placeholder="">

    <label for="pourquoi">Pourquoi ce titre ? (optionnel)</label>
    <textarea id="pourquoi" name="pourquoi" rows="3" placeholder="Explique pourquoi tu veux voir ce contenu sur NovelNeko"></textarea>

    <button type="submit">Envoyer la suggestion</button>
    <div id="formMessage"></div>
  </form>

  <script>
    // Remplace par ton URL de webhook Discord
    const webhookUrl = "https://discord.com/api/webhooks/1389984002772828343/By-ZrDaRBOZrS6TLgZMfROOgGBvl8W6vC_3k2_K2OMuxP9eZ_DVpibMpG2ZA9fQDFz8t";

    document.getElementById('suggestionForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const type = document.getElementById('type').value;
      const titre = document.getElementById('titre').value;
      const pseudo = document.getElementById('pseudo').value;
      const pourquoi = document.getElementById('pourquoi').value;

      let message = `📝 **Nouvelle proposition reçue sur NovelNeko !**\n`;
      message += `\n`;
      message += `📚 **Type :** ${type}\n`;
      message += `📖 **Titre proposé** : ${titre}\n`;
      if(pseudo) message += `👤 **Proposé par ** : ${pseudo}\n`;
      if(pourquoi) message += `📋 **Description/Raison** : ${pourquoi}\n`;
      message += `\n`;
      message += "📅**Date** : " + new Date().toLocaleDateString('fr-FR', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit'
      });
      message += `\n`;
      message += '⏰ **Heure** : ' + new Date().toLocaleTimeString('fr-FR', {
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
      });



      fetch(webhookUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ content: message })
      })
      .then(response => {
        if(response.ok) {
          document.getElementById('formMessage').innerHTML = '<div class="success-message">Suggestion envoyée avec succès ! Merci 💖</div>';
          document.getElementById('suggestionForm').reset();
        } else {
          document.getElementById('formMessage').innerHTML = '<div class="error-message">Erreur lors de l\'envoi. Réessayez plus tard.</div>';
        }
      })
      .catch(() => {
        document.getElementById('formMessage').innerHTML = '<div class="error-message">Erreur réseau. Réessayez plus tard.</div>';
      });
    });
  </script>
</body>
</html>
