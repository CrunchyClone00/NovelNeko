<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Shikimori n’est pas juste mignonne</title>
  <style>
    :root {
      --primary: #3a7bd5;
      --primary-glow: #4e9aff;
      --secondary: #00d2ff;
      --accent: #ff6b6b;
      --background-start: #0f172a;
      --background-end: #020617;
      --card-bg: rgba(15, 23, 42, 0.7);
      --card-hover: rgba(30, 41, 59, 0.9);
      --card-border: rgba(99, 102, 241, 0.2);
      --text-primary: #e2e8f0;
      --text-secondary: #94a3b8;
      --text-accent: #f8fafc;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, var(--background-start), var(--background-end));
      color: var(--text-primary);
      margin: 0;
      padding: 0;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
      max-width: 1200px;
      margin-left: auto;
      margin-right: auto;
    }

    .header {
      display: flex;
      padding: 2rem;
      gap: 2rem;
      animation: fadeIn 1s ease-out;
      align-items: center;
      background: var(--card-bg);
      backdrop-filter: blur(8px);
      border-radius: 16px;
      margin: 2rem;
      border: 1px solid var(--card-border);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      position: relative;
      z-index: 1;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
      background: linear-gradient(45deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 15px rgba(74, 222, 255, 0.4);
      text-align: center;
    }

    #scansPlacement {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      margin-bottom: 2rem;
    }

    .manga-page {
      width: 100%;
      max-width: 600px;
      height: auto;
      object-fit: contain;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      border-radius: 10px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      transition: transform 0.3s ease;
    }

    .manga-page:hover {
      transform: scale(1.03);
      box-shadow: 0 8px 25px rgba(74, 222, 255, 0.2);
    }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1rem;
      padding: 1.5rem;
      background: var(--card-bg);
      backdrop-filter: blur(8px);
      border-radius: 12px;
      margin: 2rem;
      border: 1px solid var(--card-border);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      flex-wrap: wrap;
    }

    .nav-btn {
      background: linear-gradient(45deg, var(--primary), var(--secondary));
      color: white;
      padding: 0.8rem 1.5rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-weight: 500;
      box-shadow: 0 4px 15px rgba(74, 222, 255, 0.3);
      font-size: 1rem;
    }

    .nav-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(74, 222, 255, 0.5);
    }

    .nav-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #chapitreSelectTop, #chapitreSelectBottom {
      background: var(--card-bg);
      color: var(--text-primary);
      padding: 0.8rem 1.5rem;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    #chapitreSelectTop:hover, #chapitreSelectBottom:hover {
      border-color: var(--primary-glow);
    }

    .back-btn {
      display: inline-block;
      background: linear-gradient(45deg, var(--accent), #ff8787);
      color: white;
      padding: 0.8rem 1.5rem;
      text-decoration: none;
      border-radius: 8px;
      transition: all 0.3s ease;
      font-weight: 500;
      box-shadow: 0 4px 15px rgba(255, 107, 107, 0.3);
    }

    .back-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(255, 107, 107, 0.5);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 1.5rem;
      }
      .manga-page {
        max-width: 98vw;
      }
      .controls {
        gap: 0.5rem;
        padding: 1rem;
      }
      .nav-btn, .back-btn {
        padding: 0.6rem 1rem;
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>
  <h1 id="titreTome">Shikimori n’est pas juste mignonne - Tome </h1>

  <div class="controls" id="controlsTop">
    <button class="nav-btn" id="prevBtnTop">⬅ Précédent</button>
    <select id="chapitreSelectTop"></select>
    <button class="nav-btn" id="nextBtnTop">Suivant ➡</button>
    <a href="index.html" class="back-btn">⬅ Retour</a>
  </div>

  <div id="scansPlacement"></div>

  <div class="controls">
    <button class="nav-btn" id="prevBtnBottom">⬅ Précédent</button>
    <select id="chapitreSelectBottom"></select>
    <button class="nav-btn" id="nextBtnBottom">Suivant ➡</button>
    <a href="index.html" class="back-btn">⬅ Retour</a>
  </div>

  <script>
  const scansPlacement = document.getElementById("scansPlacement");
  const titreTome = document.getElementById("titreTome");

  const parsed = Number(new URLSearchParams(window.location.search).get("tome"));
  let currentTome = Number.isInteger(parsed) && parsed > 0 ? parsed : 1;
  titreTome.textContent = `Shikimori n’est pas juste mignonne - Tome ${currentTome}`;

  const basePath = 'https://c.sushiscan.net/wp-content/uploads89/';
  const maxPagesByTome = { 1: 143, 2: 300, 3: 300, 4: 300 };
  const maxPages = maxPagesByTome[currentTome] ?? 300;
  const zeroPad = (n) => String(n).padStart(3, '0');

  // UI debug
  const status = document.createElement('div');
  status.style.color = 'var(--text-secondary)';
  status.style.textAlign = 'center';
  status.style.margin = '1rem 0';
  scansPlacement.parentNode.insertBefore(status, scansPlacement);

  const testLink = document.createElement('a');
  testLink.target = '_blank';
  testLink.style.display = 'block';
  testLink.style.color = 'var(--text-secondary)';
  testLink.style.marginBottom = '0.5rem';
  scansPlacement.parentNode.insertBefore(testLink, scansPlacement);

  let tried = 0;
  let found = 0;
  let consecutiveMiss = 0;
  const maxConsecutiveMiss = 12; // arrête après X erreurs consécutives
  let lastTestedUrl = '';

  function updateStatus(page) {
    status.textContent = `Testé: ${page}/${maxPages} — trouvées: ${found} — erreurs consécutives: ${consecutiveMiss}`;
    testLink.href = lastTestedUrl;
    testLink.textContent = lastTestedUrl ? `Ouvrir URL testée: ${lastTestedUrl}` : '';
  }

  // Essaye d'obtenir le code HTTP si CORS le permet
  async function tryFetchStatus(url) {
    try {
      const res = await fetch(url, { method: 'HEAD' });
      console.log('Fetch HEAD:', url, '=>', res.status);
      return res.status;
    } catch (err) {
      console.warn('Fetch HEAD impossible (CORS probable) pour', url, err);
      return null;
    }
  }

  function loadPage(pageIndex) {
    if (pageIndex > maxPages) {
      updateStatus(maxPages);
      console.log('Terminé: atteint maxPages', maxPages, 'trouvées:', found);
      return;
    }
    if (consecutiveMiss >= maxConsecutiveMiss) {
      updateStatus(pageIndex - 1);
      console.log('Arrêt: trop d\'erreurs consécutives:', consecutiveMiss);
      return;
    }

    const pageNum = zeroPad(pageIndex);
    const url = `${basePath}ShikimoriMignonneTome${currentTome}-${pageNum}.webp`;
    lastTestedUrl = url;
    console.log('Test URL:', url);

    const img = document.createElement('img');
    img.className = 'manga-page';
    img.alt = `Page ${pageIndex}`;
    img.style.opacity = '0';
    img.style.transition = 'opacity 0.3s ease';

    img.onload = () => {
      img.style.opacity = '1';
      found++;
      tried++;
      consecutiveMiss = 0;
      updateStatus(pageIndex);
      setTimeout(() => loadPage(pageIndex + 1), 120);
    };

    img.onerror = async () => {
      img.remove();
      tried++;
      consecutiveMiss++;
      console.warn('Erreur/Manquante:', url);
      updateStatus(pageIndex);
      // tente fetch HEAD pour connaître le code si possible
      await tryFetchStatus(url);
      setTimeout(() => loadPage(pageIndex + 1), 60);
    };

    scansPlacement.appendChild(img);
    img.src = url;
  }

  loadPage(1);
</script>
</body>
</html>
