<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=0.8">
  <title>SAO - Phantom Bullet - Volume 2</title>
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0f172a, #020617);
      color: #e2e8f0;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      max-width: 900px;
      margin-left: auto;
      margin-right: auto;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      padding: 2rem 1rem 1rem 1rem;
    }
    .back-btn {
      display: inline-block;
      background: linear-gradient(45deg, #3a7bd5, #00d2ff);
      color: white;
      padding: 0.7rem 1.3rem;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 500;
      box-shadow: 0 4px 15px rgba(74, 222, 255, 0.2);
      transition: all 0.3s;
    }
    .back-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(74, 222, 255, 0.3);
    }
    h1 {
      font-size: 2rem;
      margin: 0;
      background: linear-gradient(45deg, #3a7bd5, #00d2ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 15px rgba(74, 222, 255, 0.2);
    }
    .pages {
      margin: 2rem 0;
      display: flex;
      flex-direction: column;
      gap: 2rem;
      align-items: center;
    }
    .pages img {
      max-width: 100%;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      background: #1e293b;
    }
    @media (max-width: 600px) {
      .header { flex-direction: column; gap: 0.5rem; }
      h1 { font-size: 1.2rem; }
      .pages { gap: 1rem; }
    }
  </style>
</head>
<body>
  <div class="header">
    <a href="arc3.html" class="back-btn">← Retour</a>
    <h1>Sword Art Online - Arc Phantom Bullet<br>Volume 2</h1>
</div>
<script>
  document.getElementById('chapitreSelect').addEventListener('change', function() {
    window.location.href = this.value;
  });
</script>

<div class="pages" id="pages"></div>
  <script>
    const container = document.getElementById('pages');
    for(let i=1; i<=90; i++) {
      const num = String(i).padStart(2, '0');
      const img = document.createElement('img');
      img.src = `volume2/${num}.jpg`;
      img.alt = `Page ${i}`;
      img.onerror = function() {
        this.onerror = null;
        this.src = `volume2/${num}.png`;
      };
      container.appendChild(img);
    }
  </script>
  <a href="arc3.html" class="back-btn">← Retour</a>
</body>
</html>
