<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NovelNeko - Redirection</title>
    <meta http-equiv="refresh" content="1; url=https://novelneko.fr">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        * { margin:0; padding:0; box-sizing:border-box; }
        html, body {
            height:100%;
            scrollbar-width:none;
            -ms-overflow-style:none;
        }
        body::-webkit-scrollbar { display:none; }
        body {
            font-family:'Inter',sans-serif;
            color:white;
            background:#000;
            min-height:100vh;
            position:relative;
            overflow-x:hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .background {
            position:fixed;
            inset:0;
            background:url('https://wallpapers.com/images/hd/blue-4k-space-nebula-hd-x8cxcv8kv8nifawc.jpg') center/cover no-repeat;
            z-index:-3;
        }
        .glow-overlay {
            position:fixed;
            inset:0;
            background:radial-gradient(circle at 50% 40%, rgba(0,255,150,0.12), transparent 60%),
                       radial-gradient(circle at 20% 80%, rgba(100,200,255,0.08), transparent 70%);
            z-index:-2;
        }
        .blur-layer {
            position:fixed;
            inset:0;
            backdrop-filter:blur(80px);
            z-index:-1;
        }

        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            max-width: 600px;
            width: 90%;
            padding: 60px 40px;
            background: rgba(15, 15, 35, 0.65);
            border-radius: 24px;
            border: 1px solid rgba(176, 255, 216, 0.08);
            backdrop-filter: blur(6px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.35);
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            font-size: 42px;
            font-weight: 800;
            letter-spacing: -0.6px;
            background: linear-gradient(90deg, #1C66B0, #1324D6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 24px;
            animation: slideUp 0.6s ease-out 0.1s both;
        }

        h1 {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 20px;
            background: linear-gradient(90deg, #b0ffd8, #00ffaa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: slideUp 0.6s ease-out 0.2s both;
        }

        .description {
            color: rgba(225,225,240,0.92);
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 40px;
            animation: slideUp 0.6s ease-out 0.3s both;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 30px;
        }

        .dot {
            width: 10px;
            height: 10px;
            background: #b0ffd8;
            border-radius: 50%;
            animation: bounce 1.4s infinite;
            box-shadow: 0 0 10px rgba(176, 255, 216, 0.6);
        }

        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: translateY(0); opacity: 0.7; }
            40% { transform: translateY(-14px); opacity: 1; }
        }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 32px;
            background: rgba(29, 111, 219, 0.774);
            border: 1px solid rgba(88, 101, 242, 0.4);
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(88, 101, 242, 0.3);
            animation: slideUp 0.6s ease-out 0.4s both;
        }

        .button:hover {
            background: rgba(83, 85, 211, 0.548);
            transform: translateY(-3px);
            box-shadow: 0 8px 32px rgba(88, 101, 242, 0.5);
        }

        .button:active {
            transform: translateY(-1px);
        }

        .timer {
            font-size: 13px;
            color: rgba(240,240,255,0.65);
            margin-top: 32px;
            animation: slideUp 0.6s ease-out 0.5s both;
        }

        .timer strong {
            color: #b0ffd8;
            font-weight: 600;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 36px;
            }

            .container {
                padding: 40px 24px;
                margin: 20px;
            }

            .logo {
                font-size: 36px;
            }

            .description {
                font-size: 15px;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 28px;
            }

            .logo {
                font-size: 28px;
            }

            .container {
                padding: 30px 16px;
            }
        }
    </style>
</head>
<body>
    <div class="background"></div>
    <div class="glow-overlay"></div>
    <div class="blur-layer"></div>

    <div class="container">
        <div class="logo">NovelNeko</div>
        <h1>Redirection en cours</h1>
        
        <div class="loading">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>

        <p class="description">
            Vous allez être redirigé vers <strong>novelneko.fr</strong>
        </p>

        <a href="https://novelneko.fr" class="button">
            → Accéder au site
        </a>

        <div class="timer">
            Redirection automatique dans <strong id="countdown">3</strong> secondes
        </div>
    </div>

    <script>
        let seconds = 1;
        const countdown = document.getElementById('countdown');
        
        setInterval(() => {
            seconds--;
            countdown.textContent = seconds;
        }, 1000);
    </script>
</body>
</html>
