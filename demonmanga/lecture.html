<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Demon Slayer : Kimetsu No Yaiba</title>
  <style>
    :root {
      --primary: #3a7bd5;
      --primary-glow: #4e9aff;
      --secondary: #00d2ff;
      --accent: #ff6b6b;
      --background-start: #0f172a;
      --background-end: #020617;
      --card-bg: rgba(15, 23, 42, 0.7);
      --card-hover: rgba(30, 41, 59, 0.9);
      --card-border: rgba(99, 102, 241, 0.2);
      --text-primary: #e2e8f0;
      --text-secondary: #94a3b8;
      --text-accent: #f8fafc;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, var(--background-start), var(--background-end));
      color: var(--text-primary);
      margin: 0;
      padding: 0;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
      max-width: 1200px;
      margin-left: auto;
      margin-right: auto;
    }

    .header {
      display: flex;
      padding: 2rem;
      gap: 2rem;
      animation: fadeIn 1s ease-out;
      align-items: center;
      background: var(--card-bg);
      backdrop-filter: blur(8px);
      border-radius: 16px;
      margin: 2rem;
      border: 1px solid var(--card-border);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      position: relative;
      z-index: 1;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
      background: linear-gradient(45deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 15px rgba(74, 222, 255, 0.4);
      text-align: center;
    }

    #scansPlacement {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      margin-bottom: 2rem;
    }

    .manga-page {
      width: 100%;
      max-width: 600px;
      height: auto;
      object-fit: contain;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      border-radius: 10px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      transition: transform 0.3s ease;
    }

    .manga-page:hover {
      transform: scale(1.03);
      box-shadow: 0 8px 25px rgba(74, 222, 255, 0.2);
    }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1rem;
      padding: 1.5rem;
      background: var(--card-bg);
      backdrop-filter: blur(8px);
      border-radius: 12px;
      margin: 2rem;
      border: 1px solid var(--card-border);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      flex-wrap: wrap;
    }

    .nav-btn {
      background: linear-gradient(45deg, var(--primary), var(--secondary));
      color: white;
      padding: 0.8rem 1.5rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-weight: 500;
      box-shadow: 0 4px 15px rgba(74, 222, 255, 0.3);
      font-size: 1rem;
    }

    .nav-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(74, 222, 255, 0.5);
    }

    .nav-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #chapitreSelectTop, #chapitreSelectBottom {
      background: var(--card-bg);
      color: var(--text-primary);
      padding: 0.8rem 1.5rem;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    #chapitreSelectTop:hover, #chapitreSelectBottom:hover {
      border-color: var(--primary-glow);
    }

    .back-btn {
      display: inline-block;
      background: linear-gradient(45deg, var(--accent), #ff8787);
      color: white;
      padding: 0.8rem 1.5rem;
      text-decoration: none;
      border-radius: 8px;
      transition: all 0.3s ease;
      font-weight: 500;
      box-shadow: 0 4px 15px rgba(255, 107, 107, 0.3);
    }

    .back-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(255, 107, 107, 0.5);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 1.5rem;
      }
      .manga-page {
        max-width: 98vw;
      }
      .controls {
        gap: 0.5rem;
        padding: 1rem;
      }
      .nav-btn, .back-btn {
        padding: 0.6rem 1rem;
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>
  <h1 id="titreTome">Demon Slayer - Tome </h1>

  <div class="controls" id="controlsTop">
    <button class="nav-btn" id="prevBtnTop">⬅ Précédent</button>
    <select id="chapitreSelectTop"></select>
    <button class="nav-btn" id="nextBtnTop">Suivant ➡</button>
    <a href="indexdemon.html" class="back-btn">⬅ Retour</a>
  </div>

  <div id="scansPlacement"></div>

  <div class="controls">
    <button class="nav-btn" id="prevBtnBottom">⬅ Précédent</button>
    <select id="chapitreSelectBottom"></select>
    <button class="nav-btn" id="nextBtnBottom">Suivant ➡</button>
    <a href="indexdemon.html" class="back-btn">⬅ Retour</a>
  </div>

  <script>
    const maxPages = 300;
    const maxTomes = 23;
    const scansPlacement = document.getElementById("scansPlacement");
    const titreTome = document.getElementById("titreTome");

    let currentTome = parseInt(new URLSearchParams(window.location.search).get("tome")) || 1;
    titreTome.textContent = `Demon Slayer - Tome ${currentTome}`;

    // Remplir les selects de tomes
    const selectTop = document.getElementById("chapitreSelectTop");
    const selectBottom = document.getElementById("chapitreSelectBottom");
    
    for (let i = 1; i <= maxTomes; i++) {
      const optionTop = document.createElement("option");
      optionTop.value = i;
      optionTop.textContent = `Tome ${i}`;
      if (i === currentTome) optionTop.selected = true;
      selectTop.appendChild(optionTop);

      const optionBottom = document.createElement("option");
      optionBottom.value = i;
      optionBottom.textContent = `Tome ${i}`;
      if (i === currentTome) optionBottom.selected = true;
      selectBottom.appendChild(optionBottom);
    }

    // Fonction pour changer de tome
    function changeTome(tome) {
      window.location.href = `?tome=${tome}`;
    }

    // Event listeners pour les selects
    selectTop.addEventListener("change", (e) => changeTome(e.target.value));
    selectBottom.addEventListener("change", (e) => changeTome(e.target.value));

    // Event listeners pour les boutons précédent/suivant
    const prevBtnTop = document.getElementById("prevBtnTop");
    const nextBtnTop = document.getElementById("nextBtnTop");
    const prevBtnBottom = document.getElementById("prevBtnBottom");
    const nextBtnBottom = document.getElementById("nextBtnBottom");

    if (currentTome <= 1) {
      prevBtnTop.disabled = true;
      prevBtnBottom.disabled = true;
    }
    if (currentTome >= maxTomes) {
      nextBtnTop.disabled = true;
      nextBtnBottom.disabled = true;
    }

    prevBtnTop.addEventListener("click", () => {
      if (currentTome > 1) changeTome(currentTome - 1);
    });
    nextBtnTop.addEventListener("click", () => {
      if (currentTome < maxTomes) changeTome(currentTome + 1);
    });
    prevBtnBottom.addEventListener("click", () => {
      if (currentTome > 1) changeTome(currentTome - 1);
    });
    nextBtnBottom.addEventListener("click", () => {
      if (currentTome < maxTomes) changeTome(currentTome + 1);
    });

    // Charger les pages du manga progressivement
    const baseUrl = `https://s22.anime-sama.me/s1/scans/Kimetsu%20no%20Yaiba/Volume%20${currentTome}/`;
    let loadedPages = 0;
    let failedPages = 0;
    const maxFailures = 5; // Arrêter après 5 échecs consécutifs

    function loadNextPage(pageIndex) {
      if (pageIndex > maxPages || failedPages >= maxFailures) return;

      const pageNum = pageIndex.toString().padStart(3, '0');
      const img = document.createElement("img");
      img.className = "manga-page";
      img.alt = `Page ${pageIndex}`;
      img.style.opacity = '0';
      img.style.transition = 'opacity 0.3s ease';

      img.onload = () => {
        img.style.opacity = '1';
        loadedPages++;
        failedPages = 0; // Réinitialiser le compteur d'échecs
        // Charger la page suivante après un court délai
        setTimeout(() => loadNextPage(pageIndex + 1), 100);
      };

      img.onerror = () => {
        img.remove();
        failedPages++;
        // Continuer à charger même en cas d'erreur
        setTimeout(() => loadNextPage(pageIndex + 1), 50);
      };

      img.src = `${baseUrl}DemonSlayerTome${currentTome}-${pageNum}.jpg`;
      scansPlacement.appendChild(img);
    }

    // Démarrer le chargement progressif
    loadNextPage(1);
  </script>
</body>
</html>
